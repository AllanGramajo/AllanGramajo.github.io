name: Verify radar website links
on:
  push:
    branches: [main]
    paths:
      - Heart-and-Chest-radar/**
      - _radar_build/**
      - .github/workflows/verify-radar-links.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Chromium interaction tests
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify the public HTML matches this release without signing in
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, time, urllib.request
          url='https://allangramajo.github.io/Heart-and-Chest-radar/'
          expected=hashlib.sha256(Path('Heart-and-Chest-radar/index.html').read_bytes()).hexdigest()
          for attempt in range(30):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'radar-public-check/2.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      assert r.status==200
                      raw=r.read(60*1024*1024)
                  if hashlib.sha256(raw).hexdigest()==expected:
                      print('PASS: anonymous HTTP 200; exact generated eight-recording release:',url)
                      break
                  print('Pages still serves the previous release; checking again.')
              except Exception as e:
                  print(type(e).__name__,str(e))
              time.sleep(8)
          else:
              raise SystemExit('Published page did not match the expected release.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Restored live radar website\n\n'+url+'\n\nAnonymous HTTP 200; published HTML matches the release checksum.\n')
          PY
      - name: Test all public recording choices and playback in a real browser
        run: python3 _radar_build/check.py --live https://allangramajo.github.io/Heart-and-Chest-radar/
      - name: Save public browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-live-verification
          path: |
            _radar_test_results/results.json
            _radar_test_results/recordings.png
          retention-days: 7
